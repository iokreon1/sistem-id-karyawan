<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Profil & Kompetensi Karyawan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#1b5e20',
                            light: '#4c8c4a',
                            dark: '#003300'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .skeleton {
            background: #eee;
            background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%);
            border-radius: 5px;
            background-size: 200% 100%;
            animation: 1.5s shine linear infinite;
        }
        @keyframes shine {
            to { background-position-x: -200%; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">
    <!-- Header -->
    <header class="bg-brand-green text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-2 hover:text-gray-200 transition">
                <i class="fa-solid fa-house"></i>
                <span class="font-medium">Home</span>
            </a>
            <h1 class="text-lg font-bold truncate mx-4">Profil Karyawan</h1>
            <button onclick="window.print()" class="hover:text-gray-200 transition">
                <i class="fa-solid fa-print"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6 max-w-3xl">
        
        <!-- Loading State -->
        <div id="loadingState" class="space-y-6">
            <div class="bg-white rounded-xl shadow-sm p-6 flex flex-col md:flex-row items-center md:items-start gap-6">
                <div class="skeleton w-32 h-32 rounded-full flex-shrink-0"></div>
                <div class="w-full space-y-3">
                    <div class="skeleton h-8 w-3/4"></div>
                    <div class="skeleton h-4 w-1/2"></div>
                    <div class="skeleton h-4 w-1/3"></div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-6 space-y-4">
                <div class="skeleton h-6 w-1/3"></div>
                <div class="skeleton h-10 w-full"></div>
                <div class="skeleton h-10 w-full"></div>
            </div>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden bg-white rounded-xl shadow-sm p-8 text-center space-y-4">
            <div class="w-20 h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto">
                <i class="fa-solid fa-circle-exclamation text-4xl"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800">Data Tidak Ditemukan</h2>
            <p id="errorMessage" class="text-gray-500">NRP karyawan tidak valid atau tidak terdaftar dalam sistem.</p>
            <a href="scanner.html" class="inline-block mt-4 px-6 py-2 bg-brand-green text-white rounded-md font-medium hover:bg-brand-dark transition">Scan Ulang</a>
        </div>

        <!-- Data Content -->
        <div id="dataContent" class="hidden space-y-6">
            
            <!-- Biodata Card -->
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                <div class="h-24 bg-brand-light"></div>
                <div class="px-6 pb-6 relative">
                    <div class="flex flex-col md:flex-row items-center md:items-end -mt-12 mb-4 gap-4">
                        <img id="profilFoto" src="" alt="Foto Profil" class="w-28 h-28 object-cover rounded-full border-4 border-white shadow-md bg-white">
                        <div class="text-center md:text-left mb-2 flex-grow">
                            <h2 id="profilNama" class="text-2xl font-bold text-gray-900">Nama Karyawan</h2>
                            <p class="text-brand-green font-semibold tracking-wide" id="profilNrp">NRP</p>
                        </div>
                        <div class="bg-green-50 text-brand-green px-4 py-2 rounded-lg font-medium text-sm flex items-center shadow-sm">
                            <i class="fa-solid fa-circle-check mr-2"></i> Aktif
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6 pt-6 border-t border-gray-100">
                        <div class="flex items-start">
                            <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 mr-3 flex-shrink-0">
                                <i class="fa-solid fa-building"></i>
                            </div>
                            <div>
                                <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Departemen</p>
                                <p id="profilDept" class="text-gray-900 font-medium">Departemen</p>
                            </div>
                        </div>
                        <div class="flex items-start">
                            <div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center text-orange-600 mr-3 flex-shrink-0">
                                <i class="fa-solid fa-user-tie"></i>
                            </div>
                            <div>
                                <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Jabatan</p>
                                <p id="profilJabatan" class="text-gray-900 font-medium">Jabatan</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Kompetensi Table -->
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                    <h3 class="text-lg font-bold text-gray-800 flex items-center">
                        <i class="fa-solid fa-certificate text-yellow-500 mr-2"></i> Matriks Kompetensi & Lisensi
                    </h3>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-200">
                                <th class="p-4 font-semibold">Nama Unit / Alat</th>
                                <th class="p-4 font-semibold text-center">Status</th>
                                <th class="p-4 font-semibold">Masa Berlaku</th>
                            </tr>
                        </thead>
                        <tbody id="kompetensiBody" class="divide-y divide-gray-100 text-sm">
                            <!-- Rows will be populated by JS -->
                        </tbody>
                    </table>
                </div>
                
                <div id="emptyKompetensi" class="hidden p-8 text-center text-gray-500">
                    <i class="fa-regular fa-folder-open text-3xl mb-2 text-gray-300"></i>
                    <p>Belum ada data kompetensi tercatat.</p>
                </div>
            </div>
            
        </div>
    </main>

    <script type="module">
        import supabase from './js/supabase-client.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const nrpParam = urlParams.get('nrp');

            const loadingState = document.getElementById('loadingState');
            const errorState = document.getElementById('errorState');
            const errorMessage = document.getElementById('errorMessage');
            const dataContent = document.getElementById('dataContent');

            if (!nrpParam) {
                showError("Parameter NRP tidak ditemukan pada URL.");
                return;
            }

            try {
                // Fetch data dari Supabase
                // Karena public anon key di set untuk read-only, ini akan berhasil
                const { data, error } = await supabase
                    .from('karyawan')
                    .select('*, karyawan_kompetensi(*)')
                    .eq('nrp', nrpParam.toUpperCase())
                    .single();

                if (error) throw error;
                
                if (data) {
                    renderData(data);
                } else {
                    showError("Karyawan dengan NRP tersebut tidak ditemukan.");
                }

            } catch (err) {
                console.error("Error fetching data:", err);
                
                if (err.code === "PGRST116") {
                    showError("NRP tersebut belum terdaftar di database Supabase, atau Row Level Security (RLS) di tabel menghalangi akses publik.");
                } else {
                    showError("Error Supabase: " + (err.message || "Gagal mengambil data dari database."));
                }
            }
        });

        function showError(msg) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('errorState').classList.remove('hidden');
            if(msg) document.getElementById('errorMessage').textContent = msg;
        }

        function renderData(data) {
            // Hide loading, show content
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('dataContent').classList.remove('hidden');

            // Populate Biodata
            document.getElementById('profilNama').textContent = data.nama_lengkap || '-';
            document.getElementById('profilNrp').textContent = data.nrp || '-';
            document.getElementById('profilDept').textContent = data.departemen || '-';
            document.getElementById('profilJabatan').textContent = data.jabatan || '-';
            
            // Handle foto
            const fotoUrl = data.foto_url ? data.foto_url : `https://ui-avatars.com/api/?name=${encodeURIComponent(data.nama_lengkap || 'User')}&background=1b5e20&color=fff&size=200`;
            document.getElementById('profilFoto').src = fotoUrl;

            // Populate Kompetensi
            const tBody = document.getElementById('kompetensiBody');
            const emptyState = document.getElementById('emptyKompetensi');
            tBody.innerHTML = '';

            if (data.karyawan_kompetensi && data.karyawan_kompetensi.length > 0) {
                emptyState.classList.add('hidden');
                
                data.karyawan_kompetensi.forEach(komp => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-gray-50 transition";
                    
                    // Badge warna untuk status
                    let statusColor = "bg-gray-100 text-gray-800";
                    let statusIcon = "fa-circle-question";
                    const statusVal = (komp.status || '').toLowerCase();
                    
                    if(statusVal === 'aktif' || statusVal === 'valid') {
                        statusColor = "bg-green-100 text-green-800 border border-green-200";
                        statusIcon = "fa-check-circle";
                    } else if (statusVal === 'expired' || statusVal === 'tidak valid') {
                        statusColor = "bg-red-100 text-red-800 border border-red-200";
                        statusIcon = "fa-times-circle";
                    } else if (statusVal === 'training' || statusVal === 'pending') {
                        statusColor = "bg-yellow-100 text-yellow-800 border border-yellow-200";
                        statusIcon = "fa-clock";
                    }

                    row.innerHTML = `
                        <td class="p-4 font-medium text-gray-800">${komp.nama_unit || '-'}</td>
                        <td class="p-4 text-center">
                            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium ${statusColor}">
                                <i class="fa-solid ${statusIcon} mr-1.5"></i> ${komp.status || '-'}
                            </span>
                        </td>
                        <td class="p-4 text-gray-600 font-mono text-sm">${komp.masa_berlaku || '-'}</td>
                    `;
                    tBody.appendChild(row);
                });
            } else {
                emptyState.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
